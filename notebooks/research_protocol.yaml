schema_version: 1
data_dir: ../data/raw
output_dir: research_protocol_outputs
instruments: [EUR_USD, USD_JPY, EUR_JPY]
years: [2024]
state_interval_milliseconds: 100
forecast_horizons_milliseconds: [5000, 10000, 30000, 60000]
context_milliseconds: 10000
maximum_staleness_milliseconds: 60000
# Two bounded processes avoid memory pressure on a 16 GB development Mac.
audit_workers: 2
training_stride_milliseconds:
  5000: 10000
  10000: 10000
  30000: 30000
  60000: 60000
evaluation_stride_milliseconds: 100
audit_policy:
  # Technical eligibility only. Label balance never excludes a session.
  minimum_duration_milliseconds: 70000
  minimum_observed_states: 700
  required_depth: 10
  redact_locked_outcomes: true
split_policy:
  # March 1 has already influenced development and cannot become final evidence.
  development_end_date: "2024-03-01"
  minimum_training_sessions: 20
  validation_sessions_per_fold: 5
  fold_step_sessions: 5
  # These dates were declared untouched before this protocol was created.
  locked_evaluation_dates:
    - "2024-01-10"
    - "2024-01-17"
    - "2024-01-24"
    - "2024-01-31"
    - "2024-02-07"
    - "2024-02-14"
    - "2024-02-21"
    - "2024-02-28"
    - "2024-03-06"
    - "2024-03-13"
    - "2024-03-20"
    - "2024-03-27"
development_instrument: EUR_USD
depths: [1, 10]
models: [deeplob_direction, tft_direction]
random_seeds: [7, 19]
validation_checks_per_epoch: 4
primary_metrics: [macro_f1, mcc]
supporting_metrics:
  [balanced_accuracy, log_loss, multiclass_brier]
bootstrap_repetitions: 10000
confidence_level: 0.95
