schema_version: 1

# Frozen before neural outcomes are observed. These values are copied unchanged
# from the pre-existing multi_session_development.yaml optimization settings.
maximum_epochs: 30
early_stopping_patience: 5
early_stopping_minimum_delta: 0.0001
gradient_clip_norm: 1.0
batch_size: 64
learning_rate: 0.0003
weight_decay: 0.0001
hidden_size: 32

# Fail rather than silently spend GPU time on a CPU fallback.
device: cuda
