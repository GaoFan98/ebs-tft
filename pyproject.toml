# Core metadata and runtime dependencies

[project]
name = "ebs-tft"
version = "0.1.0"

requires-python = "==3.13.15"
description = "TFT analysis of EBS Level 2 forex order book data"

# Runtime dependencies
dependencies = [

    # neuralforecast: primary TFT training engine.
    "neuralforecast==3.2.0",

    # darts: used for backtesting and statistical baseline comparison.
    # Its historical_forecasts() runs rolling-window evaluation automatically,
    # which we need for controlled cumulative-depth comparisons.
    "darts==0.46.1",

    # PyTorch: the deep learning engine under both neuralforecast and darts.
    "torch==2.13.0",

    # lightning: the training loop abstraction used by both libraries.
    "lightning==2.6.5",

    # optuna: hyperparameter optimization.
    # Utilized to find the best TFT config (hidden size, attention heads,
    # dropout, learning rate) across level groups.
    "optuna==4.9.0",
    "optuna-integration==4.9.0",

    # Data processing
    # polars: primary DataFrame engine for native-state reconstruction and analysis.
    "polars==1.43.2",
    "pandas==2.3.3",
    "numpy==2.3.5",

    # pyarrow: used for reading and writing Parquet files.
    # Native 100 ms states can be stored as Parquet without time aggregation.
    "pyarrow==25.0.0",

    # scikit-learn: preprocessing (StandardScaler, RobustScaler) and evaluation
    # metrics (accuracy_score, classification_report for direction prediction).
    # Also provides TimeSeriesSplit for cross-validation.
    "scikit-learn==1.9.0",

    # scipy: dependence-aware statistical analysis of observation-level losses.
    "scipy==1.18.0",

    # API and CLI serving 
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.0",

    # pydantic: request/response schema validation in FastAPI.
    "pydantic==2.13.4",
    "httpx==0.28.1",

    # Experiment tracking and visualization
    # mlflow: experiment tracking and model registry.
    # Run `uv run mlflow ui` to open the comparison dashboard.
    "mlflow==3.15.0",

    # plotly: interactive charts.
    # We use it to visualize: order book depth over time, model predictions vs actual,
    # metric comparison across level groups, attention weight heatmaps.
    # Output can be saved as HTML (interactive) or PNG (static via kaleido).
    "plotly==6.9.0",

    # kaleido: required by plotly to export static images (PNG/PDF).
    "kaleido==1.3.0",

    # Project tooling
    # attrs: value objects / data classes.
    # Use @attrs.frozen for immutable objects (OrderBookBar, DatasetSpec, etc.)
    # Use @attrs.define for mutable objects
    "attrs==26.1.0",

    # typer: CLI framework built on top of Python's argparse.
    # Used to build: `uv run python -m ebs_tft.interfaces.cli ingest`
    "typer==0.27.0",

    # pyyaml: reads the YAML config files in configs/.
    # configs/instruments.yaml, configs/model_defaults.yaml, configs/training.yaml
    "pyyaml==6.0.3",

    "python-dotenv==1.2.2",
]

# [project.optional-dependencies] — dev tools
# These are NOT installed by default. Install with: uv sync --extra dev
# Keeping them separate means production images stay lean.

[project.optional-dependencies]
dev = [
    # pytest: the test runner. Per testing.md rules:
    #   - tests/unit/        isolated, no DB/network, mock collaborators
    #   - tests/integration/ multiple units, may use filesystem
    #   - tests/functional/  end-to-end, only patch third-party
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "freezegun==1.5.5",
    "ruff==0.16.1",
    "mypy==2.3.0",
    # pytest-cov: coverage reports. Run with: uv run pytest --cov=src/ebs_tft
    "pytest-cov==7.1.0",
]
pilot = [
    # Local-only notebook interface. Model and data logic remains in src/ebs_tft.
    "jupyterlab==4.6.3",
]

[project.scripts]
ebs-tft = "ebs_tft.interfaces.cli.commands:main"


# [build-system] — tells uv/pip HOW to build the package
# hatchling is a modern, minimal build backend. It reads [project] above
# and knows how to package src/ebs_tft/ into an installable wheel.
# We don't publish to PyPI, but this makes `uv run` work correctly by
# installing the ebs_tft package in editable mode into the project.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# [tool.hatch.build.targets.wheel] — tells hatchling where the source is
# Without this, hatchling looks for a package in the root directory.
# With src/ layout, we must tell it to look inside src/.
[tool.hatch.build.targets.wheel]
packages = ["src/ebs_tft"]

# Linting and formatting configuration
[tool.ruff]
# All source code lives in src/
src = ["src"]
# Maximum line length — 88 is the black default, widely accepted
line-length = 88
[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors (spacing, indentation)
    "F",  # pyflakes (unused imports, undefined names)
    "I",  # isort (import ordering)
    "N",  # pep8 naming (class names, function names)
    "UP", # pyupgrade (modernize Python syntax: f-strings, etc.)
]

# Static type checking configuration
[tool.mypy]
# strict = true enables all optional checks at once, including:
#   - disallow_untyped_defs: every function must have type annotations
#   - warn_return_any: can't return Any without explicit cast
#   - no_implicit_optional: Optional[X] must be written explicitly
strict = true
python_version = "3.13"
mypy_path = "src"
ignore_missing_imports = true

# Pytest configuration
[tool.pytest.ini_options]
# asyncio_mode = "auto" means any async test function is automatically treated
# as an asyncio test — no need to add @pytest.mark.asyncio on every test
asyncio_mode = "auto"
testpaths = ["tests"]
# Default flags: -v (verbose output), --tb=short (shorter tracebacks)
addopts = "-v --tb=short"
